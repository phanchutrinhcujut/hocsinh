<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Quản lý Cuộc thi THPT Phan Chu Trinh - Cư Jút</title>

  <!-- 1. Icon hiển thị trên tab trình duyệt -->
  <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/tgqnyg3p/logo-pct.jpg">
  <link rel="shortcut icon" type="image/jpeg" href="https://i.postimg.cc/tgqnyg3p/logo-pct.jpg">

  <!-- 2. Icon khi lưu ra màn hình chính điện thoại -->
  <link rel="apple-touch-icon" href="https://i.postimg.cc/tgqnyg3p/logo-pct.jpg">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cuộc thi PCT">
  <meta name="application-name" content="Cuộc thi PCT">
  <meta name="theme-color" content="#1e3a8a">

  <!-- 3. Thông tin và ảnh khi gửi link qua Zalo, Facebook, Messenger -->
  <meta property="og:title" content="Quản lý Cuộc thi THPT Phan Chu Trinh - Cư Jút">
  <meta property="og:description" content="Cổng nộp minh chứng và theo dõi cuộc thi, khảo sát, học tập trực tuyến của trường.">
  <meta property="og:image" content="https://i.postimg.cc/tgqnyg3p/logo-pct.jpg">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #ffffff;
    }

    /* Khung ứng dụng tràn viền toàn màn hình, hỗ trợ tai thỏ và nốt ruồi camera */
    #appFrame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      outline: none;
    }

    #loadingCover {
      position: fixed;
      inset: 0;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      z-index: 9999;
      transition: opacity 0.4s ease;
      padding: 20px;
      text-align: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #3b82f6;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .hint {
      margin-top: 18px;
      font-size: 12px;
      color: #94a3b8;
      display: none;
    }
    .hint a { color: #93c5fd; }
  </style>
</head>
<body>

  <div id="loadingCover">
    <div class="spinner"></div>
    <div style="font-size: 15px; font-weight: 600; letter-spacing: 0.5px;">Đang kết nối Cổng quản lý cuộc thi...</div>
    <div class="hint" id="hint">
      Nếu màn hình không hiện, hãy <a href="https://script.google.com/macros/s/AKfycbyHyEEFxX5-9TWRjYaCoQRTAYJA5ieck-fABc67F923ecwUJP7Cfvg2Qd5Ws_XmG4AR/exec" target="_blank" rel="noopener">mở trong tab mới</a>.
    </div>
  </div>

  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbyHyEEFxX5-9TWRjYaCoQRTAYJA5ieck-fABc67F923ecwUJP7Cfvg2Qd5Ws_XmG4AR/exec"
    title="Cổng quản lý cuộc thi"
    allow="clipboard-write; fullscreen"
    onload="document.getElementById('loadingCover').style.opacity='0'; setTimeout(()=>document.getElementById('loadingCover').style.display='none', 400);">
  </iframe>

  <script>
    // Nếu sau 12 giây màn hình chờ vẫn còn, hiện gợi ý mở trong tab mới
    setTimeout(() => {
      const cover = document.getElementById('loadingCover');
      if (cover && cover.style.display !== 'none') {
        document.getElementById('hint').style.display = 'block';
      }
    }, 12000);
  </script>

</body>
</html>
